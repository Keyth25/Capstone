<svg xmlns="http://www.w3.org/2000/svg" width="1490" height="620" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <style>
      .root { fill:#4472C4; stroke:#2F5597; stroke-width:2; }
      .hdr  { fill:#F5A93C; stroke:#C77F1F; stroke-width:1.5; }
      .box  { fill:#B4B4B4; stroke:#8A8A8A; stroke-width:1.2; }
      .rt   { fill:#10243E; font-size:17px; font-weight:bold; text-anchor:middle; }
      .ht   { fill:#1a1a1a; font-size:15px; text-anchor:middle; }
      .gt   { fill:#1a1a1a; font-size:13.5px; text-anchor:middle; }
      .ln   { stroke:#7B9BD1; stroke-width:2; fill:none; }
    </style>
  </defs>

  <rect width="1490" height="620" fill="#ffffff"/>

  <!-- Root -->
  <rect class="root" x="575" y="30" width="340" height="90" rx="4"/>
  <text class="rt" x="745" y="62">Cemetery Management</text>
  <text class="rt" x="745" y="84">System with Voice Navigation</text>
  <text class="rt" x="745" y="106">and Interactive Mapping</text>

  <!-- Top connectors: root -> horizontal spine -> module headers -->
  <path class="ln" d="M745 120 V150 M165 150 H1325 M165 150 V170 M455 150 V170 M745 150 V170 M1035 150 V170 M1325 150 V170"/>

  <!-- ================= MODULE HEADERS ================= -->
  <rect class="hdr" x="40"   y="170" width="250" height="100" rx="4"/>
  <rect class="hdr" x="330"  y="170" width="250" height="100" rx="4"/>
  <rect class="hdr" x="620"  y="170" width="250" height="100" rx="4"/>
  <rect class="hdr" x="910"  y="170" width="250" height="100" rx="4"/>
  <rect class="hdr" x="1200" y="170" width="250" height="100" rx="4"/>

  <text class="ht" x="165" y="200">Interactive</text>
  <text class="ht" x="165" y="220">Cemetery</text>
  <text class="ht" x="165" y="240">Mapping</text>

  <text class="ht" x="455" y="200">Real-time</text>
  <text class="ht" x="455" y="220">Voice</text>
  <text class="ht" x="455" y="240">Navigation</text>

  <text class="ht" x="745" y="200">Plot Availability</text>
  <text class="ht" x="745" y="220">and Reservation</text>
  <text class="ht" x="745" y="240">Management</text>

  <text class="ht" x="1035" y="192">Burial</text>
  <text class="ht" x="1035" y="212">Scheduling and</text>
  <text class="ht" x="1035" y="232">Workforce</text>
  <text class="ht" x="1035" y="252">Management</text>

  <text class="ht" x="1325" y="192">Notification</text>
  <text class="ht" x="1325" y="212">And</text>
  <text class="ht" x="1325" y="232">Announcement</text>
  <text class="ht" x="1325" y="252">System</text>

  <!-- ================= COLUMN 1: spine x=75, boxes x=95 w=180 ================= -->
  <path class="ln" d="M75 270 V474 M75 318 H95 M75 396 H95 M75 484 H95 M75 474 V484"/>
  <rect class="box" x="95" y="290" width="180" height="56" rx="3"/>
  <text class="gt" x="185" y="312">Grave</text>
  <text class="gt" x="185" y="332">Location</text>

  <rect class="box" x="95" y="368" width="180" height="56" rx="3"/>
