  <rect class="box" x="675" y="290" width="180" height="56" rx="3"/>
  <text class="gt" x="765" y="312">Plot</text>
  <text class="gt" x="765" y="332">Availability</text>

  <rect class="box" x="675" y="368" width="180" height="56" rx="3"/>
  <text class="gt" x="765" y="390">Plot</text>
  <text class="gt" x="765" y="410">Reservation</text>

  <rect class="box" x="675" y="446" width="180" height="76" rx="3"/>
  <text class="gt" x="765" y="468">Burial</text>
  <text class="gt" x="765" y="488">Space</text>
  <text class="gt" x="765" y="508">Assignment</text>

  <!-- ================= COLUMN 4: spine x=945, boxes x=965 w=180 ================= -->
  <path class="ln" d="M945 270 V474 M945 318 H965 M945 396 H965 M945 474 H965"/>
  <rect class="box" x="965" y="290" width="180" height="56" rx="3"/>
  <text class="gt" x="1055" y="312">Burial</text>
  <text class="gt" x="1055" y="332">Schedule</text>

  <rect class="box" x="965" y="368" width="180" height="56" rx="3"/>
  <text class="gt" x="1055" y="390">Workforce</text>
  <text class="gt" x="1055" y="410">Assignment</text>

  <rect class="box" x="965" y="446" width="180" height="56" rx="3"/>
  <text class="gt" x="1055" y="468">Personnel</text>
  <text class="gt" x="1055" y="488">Monitoring</text>

  <!-- ================= COLUMN 5: spine x=1235, boxes x=1255 w=180 ================= -->
  <path class="ln" d="M1235 270 V494 M1235 328 H1255 M1235 416 H1255 M1235 494 H1255"/>
  <rect class="box" x="1255" y="290" width="180" height="76" rx="3"/>
  <text class="gt" x="1345" y="312">Burial</text>
  <text class="gt" x="1345" y="332">Schedule</text>
  <text class="gt" x="1345" y="352">Notifications</text>

  <rect class="box" x="1255" y="388" width="180" height="56" rx="3"/>
  <text class="gt" x="1345" y="410">Reservation</text>
  <text class="gt" x="1345" y="430">Notifications</text>

  <rect class="box" x="1255" y="466" width="180" height="56" rx="3"/>
  <text class="gt" x="1345" y="488">Cemetery</text>
  <text class="gt" x="1345" y="508">Announcements</text>
</svg>
