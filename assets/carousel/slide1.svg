  </defs>
  <rect width="1200" height="420" fill="url(#g1)"/>
  <circle cx="900" cy="100" r="180" fill="#9C27B0" opacity="0.25" filter="url(#soft)"/>
  <circle cx="200" cy="350" r="150" fill="#6A1B9A" opacity="0.3" filter="url(#soft)"/>
  <text x="600" y="170" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-size="52" font-weight="700" letter-spacing="0.02em">Memorial Parks</text>
  <text x="600" y="225" text-anchor="middle" fill="#E1BEE7" font-family="sans-serif" font-size="22" font-weight="400">Serene and dignified resting places for your loved ones</text>
  <rect x="500" y="270" width="200" height="4" rx="2" fill="#E1BEE7" opacity="0.6"/>
